<!doctype html>
<html>
<head>
  <title>Frameset Layout Example</title>
</head>
<frameset rows="30%,70%">
  <frame src="top.html" name="topFrame">
  <frame src="bottom.html" name="bottomFrame">
</frameset>
</html>



<!doctype html>
<html>
<body>
  <h2>Navigation</h2>
  <a href="home.html" target="bottomFrame">Home</a> |
  <a href="about.html" target="bottomFrame">About</a> |
  <a href="contact.html" target="bottomFrame">Contact</a>
</body>
</html>
